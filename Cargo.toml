[package]
name = "clipboard-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.5.0"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = "0.4"
image = { version = "0.25", features = ["png"] }
log = "0.4"
env_logger = "0.11.10"
sha2 = "0.11.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eframe = "0.34.1"
egui_extras = { version = "0.34.1", features = ["image"] }
unicode-bidi = "0.3"