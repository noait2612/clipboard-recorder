[package]
name = "clipboard-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.5.0"
rusqlite = { version = "0.39", features = ["bundled"] }
chrono = "0.4"
image = { version = "0.25", features = ["png"] }
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
interprocess = "1.2"
eframe = "0.27" # The wrapper for egui
egui_extras = { version = "0.27", features = ["image"] }
unicode-bidi = "0.3"